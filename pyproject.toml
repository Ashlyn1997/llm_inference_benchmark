[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-benchmark"
version = "0.1.0"
description = "Async concurrency benchmark client for OpenAI-compatible vLLM services"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
llm-benchmark = "llm_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["llm_benchmark*"]
